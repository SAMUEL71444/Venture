; Pengaturan PHP produksi Digital.in (ditimpa di atas php.ini-production).
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

; Stack trace TIDAK memuat argumen fungsi (mencegah kode OTP/rahasia ikut ter-log).
zend.exception_ignore_args = On

; Unggahan: hasil kerja milestone maks. 20 MB per file (MilestoneReviewController).
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Kode tidak berubah selama container hidup (deploy = image baru).
opcache.validate_timestamps = 0
